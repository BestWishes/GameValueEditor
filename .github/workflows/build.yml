name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build GameValueEditor.sln -c Release
      - name: Smoke tests
        run: dotnet run --project tests/GameValueEditor.SmokeTests/GameValueEditor.SmokeTests.csproj -c Release --no-build
      - name: Publish portable application
        shell: pwsh
        run: ./scripts/publish.ps1 -Version 0.1.1
      - name: Test packaged application startup
        shell: pwsh
        run: ./scripts/test-package-startup.ps1 -ArchivePath ./dist/GameValueEditor-v0.1.1-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GameValueEditor-win-x64
          path: dist/GameValueEditor-v0.1.1-win-x64.zip
