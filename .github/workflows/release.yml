name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and test
        run: |
          dotnet build GameValueEditor.sln -c Release
          dotnet run --project tests/GameValueEditor.SmokeTests/GameValueEditor.SmokeTests.csproj -c Release --no-build
      - name: Create package
        shell: pwsh
        run: |
          $version = ("${{ github.ref_name }}").TrimStart("v")
          ./scripts/publish.ps1 -Version $version
          ./scripts/test-package-startup.ps1 -ArchivePath "./dist/GameValueEditor-v$version-win-x64.zip"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-preview.') }}
          files: dist/*.zip
